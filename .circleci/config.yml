version: 2.1
orbs:
  coveralls: coveralls/coveralls@2.2.0
  node: circleci/node@7.1.1
jobs:
  test:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          command: pnpm lint:check
          name: Linter
      - run:
          command: pnpm test:all
          name: Run tests
      - run:
          command: pnpm coverage:all
          name: Coverage reports
      - coveralls/upload:
          parallel: false
          verbose: true
          carryforward: 'All tests'
      # pnpm 11 needs Node >= 22.13, so packages are installed here and
      # reused by the Node 20 job instead of being installed again.
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
  # Runs the suite on the lowest supported Node version (engines.node).
  test-node20:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          command: node --version && npm run test:all
          name: Run tests on Node 20
workflows:
  test_fs_shadow_js:
    jobs:
      - test
      - test-node20:
          requires:
            - test
